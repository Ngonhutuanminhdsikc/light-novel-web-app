<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:fragment="header_head">
  <meta charset="UTF-8">
  <title>Admin - Quản lý Thành viên</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
  <style>
    .sidebar { min-height: 100vh; background: #343a40; color: white; }
    .sidebar a { color: #d1d1d1; text-decoration: none; padding: 10px 20px; display: block; }
    .sidebar a:hover { background: #495057; color: white; }
    .active-link { background: #0d6efd !important; color: white !important; }
    /* Hiệu ứng mờ cho hàng bị Banned */
    .user-banned { background-color: #f8d7da; opacity: 0.8; }
  </style>
</head>
<body>
<div class="container-fluid">
  <div class="row">
    <div th:replace="~{admin/fragments/layout :: sidebar}"></div>

    <main class="col-md-10 px-md-4 py-4">
      <div class="d-flex justify-content-between align-items-center mb-4 border-bottom pb-2">
        <h1 class="h2">Quản lý Thành viên</h1>

        <form th:action="@{/admin/users}" method="get" class="d-flex gap-2 w-50">
          <div class="input-group">
            <input type="text" name="keyword" th:value="${keyword}"
                   class="form-control" placeholder="Tìm tên hoặc email...">
            <button class="btn btn-primary" type="submit"><i class="bi bi-search"></i></button>
            <a th:if="${keyword}" th:href="@{/admin/users}" class="btn btn-outline-secondary">Xóa</a>
          </div>
        </form>
      </div>

      <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show" role="alert">
        <i class="bi bi-check-circle-fill me-2"></i>
        <span th:text="${successMessage}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
      </div>

      <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show" role="alert">
        <i class="bi bi-exclamation-triangle-fill me-2"></i>
        <span th:text="${errorMessage}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
      </div>

      <div class="card shadow-sm">
        <div class="card-body p-0">
          <table class="table table-hover mb-0 align-middle">
            <thead class="table-light">
            <tr>
              <th class="ps-4">ID</th>
              <th>Tên đăng nhập</th>
              <th>Email</th>
              <th>Vai trò</th>
              <th>Trạng thái</th> <th class="text-end pe-4">Thao tác</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="user : ${users}" th:classappend="${user.status.name() == 'BANNED' ? 'table-danger' : ''}">
              <td class="ps-4" th:text="${user.id}"></td>
              <td class="fw-bold" th:text="${user.userName}"></td>
              <td th:text="${user.email}"></td>
              <td>
                <span class="badge bg-primary" th:text="${user.role.roleName}"></span>
              </td>
              <td>
                <span th:if="${user.status.name() == 'ACTIVE'}" class="badge bg-success">
                  <i class="bi bi-check-circle me-1"></i> Hoạt động
                </span>
                <span th:if="${user.status.name() == 'BANNED'}" class="badge bg-danger">
                  <i class="bi bi-slash-circle me-1"></i> Bị khóa
                </span>
              </td>

              <td class="text-end pe-4">
                <div class="btn-group">

                  <div th:if="${user.role.roleName != 'ROLE_ADMIN'}">
                    <a th:if="${user.status.name() == 'ACTIVE'}"
                       th:href="@{/admin/users/status/{id}(id=${user.id}, status='BANNED')}"
                       class="btn btn-sm btn-outline-danger"
                       title="Khóa tài khoản"
                       onclick="return confirm('Khóa tài khoản này?')">
                      <i class="bi bi-lock-fill"></i>
                    </a>
                    <a th:if="${user.status.name() == 'BANNED'}"
                       th:href="@{/admin/users/status/{id}(id=${user.id}, status='ACTIVE')}"
                       class="btn btn-sm btn-outline-success"
                       title="Mở khóa tài khoản">
                      <i class="bi bi-unlock-fill"></i>
                    </a>
                  </div>

                  <span th:if="${user.role.roleName == 'ROLE_ADMIN'}" class="btn btn-sm btn-light disabled"><i class="bi bi-shield-lock" title="Không thể khóa Admin"></i></span>

                  <a th:href="@{/admin/users/edit/{id}(id=${user.id})}"
                     class="btn btn-sm btn-outline-warning" title="Chỉnh sửa">
                    <i class="bi bi-pencil"></i>
                  </a>

                  <a th:href="@{/admin/users/delete/{id}(id=${user.id})}"
                     class="btn btn-sm btn-outline-danger"
                     title="Xóa thành viên"
                     onclick="return confirm('Minh có chắc chắn muốn xóa không?')">
                    <i class="bi bi-trash"></i>
                  </a>
                </div>
              </td>

            </tr>
            <tr th:if="${users.isEmpty()}">
              <td colspan="6" class="text-center py-4 text-muted">Không tìm thấy thành viên nào phù hợp.</td>
            </tr>
            </tbody>
          </table>
        </div>
      </div>
    </main>
  </div>
</div>
</body>
</html>
