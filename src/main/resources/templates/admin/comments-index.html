<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:fragment="header_head">
  <meta charset="UTF-8">
  <title>Admin - Light Novel Management</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
  <style>
    .sidebar { min-height: 100vh; background: #343a40; color: white; }
    .sidebar a { color: #d1d1d1; text-decoration: none; padding: 10px 20px; display: block; }
    .sidebar a:hover { background: #495057; color: white; }
    .active-link { background: #0d6efd !important; color: white !important; }
  </style>
</head>
<body>
<div class="container-fluid">
  <div class="row">
    <div th:replace="~{admin/fragments/layout :: sidebar}"></div>
    <main class="col-md-10 px-md-4 py-4">
      <div class="mb-4">
        <h2 class="mb-0">Kiểm duyệt Bình luận</h2>
        <small class="text-muted">Truyện: <strong th:text="${story.title}"></strong></small>
      </div>

      <div class="list-group shadow-sm">
        <div th:each="comment : ${comments}" class="list-group-item list-group-item-action py-3">
          <div class="d-flex w-100 justify-content-between">
            <h6 class="mb-1 fw-bold text-primary" th:text="${comment.user.username}"></h6>
            <small class="text-muted" th:text="${#temporals.format(comment.createdAt, 'dd/MM/yyyy HH:mm')}"></small>
          </div>
          <p class="mb-2 text-dark" th:text="${comment.content}"></p>
          <div class="text-end">
            <a th:href="@{/commentsController/delete/{id}(id=${comment.id})}"
               class="btn btn-sm btn-link text-danger p-0"
               onclick="return confirm('Xóa bình luận này?')">
              <i class="bi bi-trash"></i> Xóa bình luận
            </a>
          </div>
        </div>

        <div th:if="${#lists.isEmpty(comments)}" class="list-group-item text-center py-5 text-muted">
          Chưa có bình luận nào cho bộ truyện này.
        </div>
      </div>

      <div class="mt-4">
        <a th:href="@{/storiesController}" class="btn btn-light border">Quay lại danh sách truyện</a>
      </div>
    </main>
  </div>
</div>
</body>
</html>
