<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Đăng ký | LN-Minh</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background-color: #1a1a1a; color: #e0e0e0; display: flex; align-items: center; justify-content: center; min-height: 100vh; }
    .register-card { background: #2d2d2d; border-radius: 12px; box-shadow: 0 8px 24px rgba(0,0,0,0.5); width: 100%; max-width: 450px; padding: 2rem; }
    .form-control { background-color: #3d3d3d; border: 1px solid #4d4d4d; color: white; }
    .form-control:focus { background-color: #454545; color: white; border-color: #0d6efd; box-shadow: none; }
    .btn-success { font-weight: bold; padding: 10px; }
</small></style>
</head>
<body>

<div class="register-card">
  <h3 class="text-center text-primary mb-4">Tạo Tài Khoản Mới</h3>

  <div th:if="${errorMessage}" class="alert alert-danger">
    <span th:text="${errorMessage}"></span>
  </div>

  <form th:action="@{/register}" th:object="${user}" method="post" autocomplete="off" novalidate>
    <div class="mb-3">
      <label class="form-label">Email</label>
      <input type="email" th:field="*{email}" id="email" class="form-control" placeholder="example@gmail.com">
      <div id="emailError" class="text-danger mt-1" style="font-size: 13px; display: none;">Email không được để trống và phải đúng định dạng!</div>
    </div>

    <div class="mb-3">
      <label class="form-label">Tên đăng nhập</label>
      <input type="text" th:field="*{userName}" id="username" class="form-control" placeholder="Tối thiểu 6 ký tự">
      <div id="usernameError" class="text-danger mt-1" style="font-size: 13px; display: none;">Tên đăng nhập phải có ít nhất 6 ký tự!</div>
    </div>

    <div class="mb-3">
      <label class="form-label">Mật khẩu</label>
      <input type="password" th:field="*{passWord}" id="password" class="form-control" autocomplete="new-password" placeholder="Tối thiểu 6 ký tự">
      <div id="passwordError" class="text-danger mt-1" style="font-size: 13px; display: none;">Mật khẩu phải có ít nhất 6 ký tự!</div>
    </div>

    <button type="submit" class="btn btn-success w-100 mt-3">ĐĂNG KÝ NGAY</button>
  </form>

  <div class="text-center mt-4">
    <span style="color: #b0b0b0;">Đã có tài khoản?</span>
    <a th:href="@{/login}" style="color: #0dcaf0; text-decoration: none; font-weight: bold; margin-left: 5px;">Quay lại đăng nhập</a>  </div>
</div>

<script>
  document.querySelector('form').addEventListener('submit', function(event) {
      let username = document.getElementById('username').value;
      let password = document.getElementById('password').value;
      let email = document.getElementById('email').value;
      let regexUsername = /^[a-zA-Z0-9]+$/;
      let regexPassword = /^[a-zA-Z0-9@]+$/;
      let regexEmail = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
      let isValid = true;


      document.getElementById('usernameError').style.display = 'none';
      document.getElementById('passwordError').style.display = 'none';
      document.getElementById('emailError').style.display = 'none';

      if (username.length < 6 || !regexUsername.test(username)) {
          document.getElementById('usernameError').innerText = "Tên đăng nhập từ 6 ký tự, chỉ gồm chữ và số!";
          document.getElementById('usernameError').style.display = 'block';
          isValid = false;
      }

      if (!regexEmail.test(email)) {
          document.getElementById('emailError').style.display = 'block';
          isValid = false;
      }

      if (password.length < 6 || !regexPassword.test(password)) {
      document.getElementById('passwordError').innerText = "Mật khẩu từ 6 ký tự, chỉ gồm chữ, số và @!";
      document.getElementById('passwordError').style.display = 'block';
      isValid = false;
      }


      if (!isValid) {
          event.preventDefault();
      }
  });
</script>
</body>
</html>
