<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{admin/tags/add-tag :: header_head}"></head>
<body>
<div class="container-fluid">
  <div class="row">
    <!-- Đảm bảo đường dẫn sidebar này cũng chính xác -->
    <div th:replace="~{admin/fragments/layout :: sidebar}"></div>

    <main class="col-md-10 p-4">
      <div class="card shadow-sm">
        <div class="card-header bg-primary text-white">
          <h3 class="card-title mb-0"><i class="bi bi-pencil-square me-2"></i>Chỉnh Sửa Thẻ (Tag)</h3>
        </div>
        <div class="card-body">

          <div th:if="${errorMessage != null}" class="alert alert-danger border-0 shadow-sm mb-3" style="color: #842029; background-color: #f8d7da; border-color: #f5c2c7; border-radius: 6px; padding: 10px 15px;">
            <i class="bi bi-exclamation-triangle-fill me-2"></i>
            <strong th:text="${errorMessage}">Tin nhắn thông báo lỗi</strong>
          </div>

          <form th:action="@{/tagsController/edit/{id}(id=${tag.id})}" th:object="${tag}" method="post" novalidate>
            <input type="hidden" th:field="*{id}">

            <div class="mb-3">
              <label for="name" class="form-label fw-bold">Tên thẻ:</label>
              <input type="text" th:field="*{name}" class="form-control" id="name"
                     th:classappend="${#fields.hasErrors('name')} ? 'is-invalid'">
              <div class="text-danger small" th:if="${#fields.hasErrors('name')}" th:text="${#fields.errors('name')[0]}"></div>
            </div>

            <div class="mb-3">
              <label for="slug" class="form-label fw-bold">Slug (Đường dẫn):</label>
              <input type="text" th:field="*{slug}" class="form-control" id="slug"
                     th:classappend="${#fields.hasErrors('slug')} ? 'is-invalid'">
              <div class="text-danger small" th:if="${#fields.hasErrors('slug')}" th:text="${#fields.errors('slug')[0]}"></div>
            </div>

            <button type="submit" class="btn btn-primary">Cập nhật</button>
          </form>

        </div>
      </div>
    </main>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
