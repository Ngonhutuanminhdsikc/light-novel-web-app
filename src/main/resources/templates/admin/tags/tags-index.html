<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:fragment="header_head">
  <meta charset="UTF-8">
  <title>Admin - Light Novel Management</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
  <style>
    .sidebar { min-height: 100vh; background: #343a40; color: white; }
    .sidebar a { color: #d1d1d1; text-decoration: none; padding: 10px 20px; display: block; }
    .sidebar a:hover { background: #495057; color: white; }
    .active-link { background: #0d6efd !important; color: white !important; }
  </style>
</head>
<body>
<div class="container-fluid">
  <div class="row">
    <div th:replace="~{admin/fragments/layout :: sidebar}"></div>
    <main class="col-md-10 px-md-4 py-4">
      <div class="d-flex justify-content-between align-items-center mb-4 border-bottom pb-2">
        <h1 class="h2">Quản lý Nhãn (Tags)</h1>
        <div class="d-flex gap-2">
          <form th:action="@{/tagsController}" method="get" class="d-flex">
            <div class="input-group">
              <input type="text" name="keyword" th:value="${keyword}"
                     class="form-control" placeholder="Tìm tên tag...">
              <button class="btn btn-outline-primary" type="submit">
                <i class="bi bi-search"></i>
              </button>
            </div>
          </form>

          <a th:href="@{/tagsController/add}" class="btn btn-success">
            <i class="bi bi-plus-circle"></i> Thêm Tag mới
          </a>
        </div>
      </div>

      <div class="card shadow-sm">
        <div class="card-body p-0">

          <div th:if="${successMessage != null}" class="alert alert-success border-0 shadow-sm mb-3" style="color: #0f5132; background-color: #d1e7dd; border-radius: 6px; padding: 10px 15px;">
            <i class="bi bi-check-circle-fill me-2"></i>
            <span th:text="${successMessage}">Tin nhắn thành công</span>
          </div>

          <div th:if="${errorMessage != null}" class="alert alert-danger border-0 shadow-sm mb-3" style="color: #842029; background-color: #f8d7da; border-radius: 6px; padding: 10px 15px;">
            <i class="bi bi-exclamation-octagon-fill me-2"></i>
            <span th:text="${errorMessage}">Tin nhắn thất bại</span>
          </div>

          <table class="table table-hover mb-0">
            <thead class="table-light">
            <tr>
              <th class="ps-4">ID</th>
              <th>Tên nhãn</th>
              <th>Slug</th>
              <th class="text-end pe-4">Thao tác</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="tag : ${tags}">
              <td class="ps-4" th:text="${tag.id}"></td>
              <td>
                <span class="badge rounded-pill bg-dark" th:text="${tag.name}"></span>
              </td>
              <td class="text-muted" th:text="${tag.slug}"></td>
              <td class="text-end pe-4">
                <a th:href="@{/tagsController/edit/{id}(id=${tag.id})}" class="btn btn-outline-warning btn-sm">
                  <i class="bi bi-pencil"></i>
                </a>
                <a th:href="@{/tagsController/delete/{id}(id=${tag.id})}"
                   class="btn btn-outline-danger btn-sm"
                   onclick="return confirm('Xóa nhãn này?')">
                  <i class="bi bi-trash"></i>
                </a>
              </td>
            </tr>
            </tbody>
          </table>
        </div>
      </div>
    </main>
  </div>
</div>
</body>
</html>
