<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:fragment="header_head">
  <meta charset="UTF-8">
  <title>Admin - Light Novel Management</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
  <style>
    .sidebar { min-height: 100vh; background: #343a40; color: white; }
    .sidebar a { color: #d1d1d1; text-decoration: none; padding: 10px 20px; display: block; }
    .sidebar a:hover { background: #495057; color: white; }
    .active-link { background: #0d6efd !important; color: white !important; }
  </style>
</head>
<body>
<div class="container-fluid">
  <div class="row">
    <div th:replace="~{admin/fragments/layout :: sidebar}"></div>

    <main class="col-md-10 p-4">
      <div class="card shadow-sm">
        <div class="card-header bg-dark text-white">
          <h3 class="card-title mb-0"><i class="bi bi-tag-fill me-2"></i>Thêm Thẻ (Tag) Mới</h3>
        </div>
        <div class="card-body">

          <div th:if="${errorMessage != null}" class="alert alert-danger border-0 shadow-sm mb-3" style="color: #842029; background-color: #f8d7da; border-color: #f5c2c7; border-radius: 6px; padding: 10px 15px;">
            <i class="bi bi-exclamation-triangle-fill me-2"></i>
            <strong th:text="${errorMessage}">Tin nhắn thông báo lỗi</strong>
          </div>

          <form th:action="@{/tagsController/add}" th:object="${tag}" method="post">

            <div class="mb-3">
              <label for="name" class="form-label fw-bold">Tên thẻ:</label>
              <input type="text" th:field="*{name}" class="form-control" id="name" placeholder="Ví dụ: Tu tiên...">

              <div class="text-danger small mt-1"
                   th:if="${#fields.hasErrors('name')}"
                   th:text="${#fields.errors('name')[0]}"></div>
            </div>

            <div class="mb-3">
              <label for="slug" class="form-label fw-bold">Slug:</label>
              <input type="text" th:field="*{slug}" class="form-control" id="slug" placeholder="tu-tien">

              <div class="text-danger small mt-1"
                   th:if="${#fields.hasErrors('slug')}"
                   th:text="${#fields.errors('slug')[0]}"></div>
            </div>

            <div class="mt-4">
              <button type="submit" class="btn btn-primary px-4">
                <i class="bi bi-check-lg me-1"></i> Lưu lại
              </button>
              <a th:href="@{/tagsController}" class="btn btn-outline-secondary px-4">
                Quay lại
              </a>
            </div>
          </form>
        </div>
      </div>
    </main>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
