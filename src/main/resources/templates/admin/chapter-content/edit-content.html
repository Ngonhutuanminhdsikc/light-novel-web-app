<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:fragment="header_head">
  <meta charset="UTF-8">
  <title>Admin - Light Novel Management</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
  <script src="https://cdn.ckeditor.com/4.22.1/standard/ckeditor.js"></script>
  <style>
    .sidebar { min-height: 100vh; background: #343a40; color: white; }
    .sidebar a { color: #d1d1d1; text-decoration: none; padding: 10px 20px; display: block; }
    .sidebar a:hover { background: #495057; color: white; }
    .active-link { background: #0d6efd !important; color: white !important; }
  </style>
</head>
<body>
<div class="container-fluid">
  <div class="row">
    <div th:replace="~{admin/fragments/layout :: sidebar}"></div>

    <main class="col-md-10 p-4">
      <div class="card shadow-sm">
        <div class="card-header bg-dark text-white d-flex justify-content-between align-items-center">

          <div th:if="${errorMessage}" class="alert alert-danger" role="alert" th:text="${errorMessage}"></div>
          <div th:if="${successMessage}" class="alert alert-success" role="alert" th:text="${successMessage}"></div>
          <h5 class="mb-0">
            <i class="bi bi-pen-fill me-2"></i>
            Soạn thảo: <span class="text-info" th:text="${chapter.title}"></span>
          </h5>
        </div>
        <div class="card-body">
          <form th:action="@{/save}" th:object="${content}" method="post">

            <input type="hidden" th:field="*{chapterId}" />

            <div class="mb-3">
              <label class="form-label fw-bold text-secondary">Nội dung chương truyện:</label>
              <textarea th:field="*{contentText}" class="form-control" rows="25"
                        style="font-family: 'Times New Roman', serif; font-size: 1.1rem; line-height: 1.6;"
                        placeholder="Bắt đầu nhập nội dung văn bản..."></textarea>
            </div>

            <div class="d-flex justify-content-between border-top pt-3">
              <a th:href="@{/chaptersController/story/{id}(id=${chapter.story.id})}" class="btn btn-outline-secondary">
                <i class="bi bi-arrow-left"></i> Quay lại
              </a>
              <button type="submit" class="btn btn-success px-5">
                <i class="bi bi-save me-1"></i> Lưu nội dung
              </button>
            </div>
          </form>
        </div>
      </div>
    </main>
  </div>
</div>
<script>
  CKEDITOR.replace('contentText', {
      height: 500,
      allowedContent: true
  });

  document.querySelector('form').addEventListener('submit', function(e) {

    var editorData = CKEDITOR.instances.contentText.getData();

    var plainText = editorData.replace(/<[^>]*>/g, '').trim();

    if (plainText === '') {
        alert('Nội dung chương không được để trống!');
        e.preventDefault();
        return false;
    }
  });
</script>
</body>
</html>
