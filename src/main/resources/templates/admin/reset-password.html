<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Đặt lại mật khẩu | LN-MINH</title>
  <style>
    body { background-color: #1a1a1a; color: white; font-family: Arial, sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
    .container { background-color: #2d2d2d; padding: 30px; border-radius: 10px; width: 350px; text-align: center; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
    h2 { color: #4CAF50; margin-bottom: 20px; }
    input { width: 100%; padding: 12px; margin: 10px 0; border-radius: 5px; border: 1px solid #444; background: #3d3d3d; color: white; box-sizing: border-box; }
    button { width: 100%; padding: 12px; background-color: #4CAF50; border: none; border-radius: 5px; color: white; font-weight: bold; cursor: pointer; margin-top: 10px; }
    button:hover { background-color: #45a049; }
    .error { color: #ff5252; margin-bottom: 10px; font-size: 14px; }
  </style>
</head>
<body>
<div class="container">
  <h2>Mật khẩu mới</h2>
  <p>Vui lòng nhập mật khẩu mới cho tài khoản của bạn</p>

  <form th:action="@{/reset-password}" method="post">
    <input type="password" name="password" placeholder="Mật khẩu mới" required>
    <input type="password" name="confirmPassword" placeholder="Xác nhận mật khẩu" required>

    <button type="submit">ĐỔI MẬT KHẨU</button>
  </form>
</div>
</body>
</html>
