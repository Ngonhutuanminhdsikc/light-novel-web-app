<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Thêm Tác giả | Admin</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
  <style>
    .sidebar { min-height: 100vh; background: #343a40; color: white; }
    .sidebar a { color: #d1d1d1; text-decoration: none; padding: 10px 20px; display: block; }
    .sidebar a:hover { background: #495057; color: white; }
  </style>
</head>
<body>
<div class="container-fluid">
  <div class="row">
    <div th:replace="~{admin/fragments/layout :: sidebar}"></div>
    <main class="col-md-10 px-md-4 py-4">
      <nav aria-label="breadcrumb">
        <ol class="breadcrumb">
          <li class="breadcrumb-item"><a th:href="@{/authors}">Tác giả</a></li>
          <li class="breadcrumb-item active">Thêm mới</li>
        </ol>
      </nav>

      <div class="card col-lg-8 shadow-sm">
        <div class="card-header bg-primary text-white fw-bold">Thêm Tác giả Mới</div>
        <div class="card-body">

          <div th:if="${errorMessage != null}" class="alert alert-danger border-0 shadow-sm mb-3">
            <i class="bi bi-exclamation-triangle-fill me-2"></i>
            <strong th:text="${errorMessage}"></strong>
          </div>

          <form th:action="@{/authors/add}" th:object="${author}" method="post" novalidate>

            <div th:if="${warningMessage != null}" class="alert alert-warning border-0 shadow-sm mb-3">
              <i class="bi bi-exclamation-triangle-fill me-2"></i>
              <span th:text="${warningMessage}"></span>
              <div class="form-check mt-2">
                <input type="checkbox" name="confirm" value="true" class="form-check-input" id="confirmCheck">
                <label class="form-check-label fw-bold text-danger" for="confirmCheck">
                  Tôi xác nhận đây là một tác giả hoàn toàn khác trùng tên!
                </label>
              </div>
            </div>

            <div class="mb-3">
              <label class="form-label fw-bold">Họ và tên</label>
              <input type="text" th:field="*{name}" class="form-control" placeholder="Nhập tên tác giả...">
              <div class="text-danger small mt-1"
                   th:if="${#fields.hasErrors('name')}"
                   th:text="${#fields.errors('name')[0]}"></div>
            </div>

            <div class="mb-3">
              <label class="form-label fw-bold">Mô tả / Tiểu sử</label>
              <textarea th:field="*{description}" class="form-control" rows="5" placeholder="Giới thiệu sơ lược..."></textarea>
            </div>

            <div class="d-flex gap-2 border-top pt-3">
              <button type="submit" class="btn btn-success px-4">Lưu tác giả</button>
              <a th:href="@{/authors}" class="btn btn-light border px-4">Hủy</a>
            </div>
          </form>

        </div>
      </div>
    </main>
  </div>
</div>
</body>
</html>
