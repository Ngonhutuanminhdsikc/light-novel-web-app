<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Chỉnh sửa Tác giả | Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <style>
        body { background-color: #f8f9fa; }
        .card { border: none; border-radius: 10px; }
        .sidebar { min-height: 100vh; background: #343a40; color: white; }
        .sidebar a { color: #d1d1d1; text-decoration: none; padding: 10px 20px; display: block; }
        .sidebar a:hover { background: #495057; color: white; }
        .active-link { background: #0d6efd !important; color: white !important; }
    </style>
</head>
<body>
<div class="container-fluid">
    <div class="row">
        <div th:replace="~{admin/fragments/layout :: sidebar}"></div>

        <main class="col-md-10 px-md-4 py-4">
            <nav aria-label="breadcrumb">
                <ol class="breadcrumb">
                    <li class="breadcrumb-item"><a th:href="@{/authors}">Tác giả</a></li>
                    <li class="breadcrumb-item active">Chỉnh sửa</li>
                </ol>
            </nav>

            <div class="d-flex justify-content-between align-items-center mb-4">
                <h1 class="h2"><i class="bi bi-pencil-square text-warning"></i> Chỉnh sửa Tác giả</h1>
            </div>

            <div class="row">
                <div class="col-md-8 col-lg-6">
                    <div class="card shadow-sm">
                        <div class="card-body p-4">

                            <div th:if="${errorMessage != null}" class="alert alert-danger border-0 shadow-sm mb-3">
                                <i class="bi bi-exclamation-triangle-fill me-2"></i>
                                <strong th:text="${errorMessage}"></strong>
                            </div>

                            <form th:action="@{/authors/edit/{id}(id=${author.id})}" th:object="${author}" method="post" novalidate>
                                <input type="hidden" th:field="*{id}">

                                <div th:if="${warningMessage != null}" class="alert alert-warning border-0 shadow-sm mb-3">
                                    <i class="bi bi-exclamation-triangle-fill me-2"></i>
                                    <span th:text="${warningMessage}"></span>
                                    <div class="form-check mt-2">
                                        <input type="checkbox" name="confirm" value="true" class="form-check-input" id="confirmCheck">
                                        <label class="form-check-label fw-bold text-danger" for="confirmCheck">
                                            Xác nhận cập nhật tên này (dù trùng lặp)!
                                        </label>
                                    </div>
                                </div>

                                <div class="mb-3">
                                    <label for="name" class="form-label fw-bold">Họ và Tên</label>
                                    <input type="text" class="form-control" id="name" th:field="*{name}" placeholder="Nhập tên tác giả...">

                                    <div class="text-danger small mt-1"
                                         th:if="${warningMessage == null && #fields.hasErrors('name')}"
                                         th:text="${#fields.errors('name')[0]}"></div>
                                </div>

                                <div class="mb-3">
                                    <label for="description" class="form-label fw-bold">Mô tả tác giả</label>
                                    <textarea class="form-control" id="description" th:field="*{description}"
                                              rows="5" placeholder="Nhập tiểu sử hoặc mô tả ngắn..."></textarea>
                                </div>

                                <div class="d-flex gap-2">
                                    <button type="submit" class="btn btn-warning px-4">
                                        <i class="bi bi-save"></i> Lưu thay đổi
                                    </button>
                                    <a th:href="@{/authors}" class="btn btn-outline-secondary px-4">Hủy bỏ</a>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>
</div>
</body>
</html>
