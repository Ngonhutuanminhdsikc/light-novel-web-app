<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:fragment="header_head">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin - Light Novel Project</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
  <style>
    body { background-color: #f8f9fa; }
    .sidebar { min-height: 100vh; background: #212529; color: white; box-shadow: 2px 0 5px rgba(0,0,0,0.1); }
    .sidebar a { color: #adb5bd; text-decoration: none; padding: 12px 20px; display: block; transition: 0.3s; }
    .sidebar a:hover { background: #343a40; color: white; padding-left: 25px; }
    .active-link { background: #0d6efd !important; color: white !important; border-radius: 4px; }
    .card { border: none; box-shadow: 0 0.125rem 0.25rem rgba(0, 0, 0, 0.075); }
  </style>
</head>
<body>
<div th:fragment="sidebar" class="col-md-2 sidebar p-0 d-none d-md-block">
  <div class="p-3 mb-2 border-bottom border-secondary text-center">
    <h5 class="text-white fw-bold">LN MANAGER</h5>
  </div>
  <nav class="px-2">
    <small class="text-uppercase fw-bold px-3 mb-2 mt-3 d-block text-white" style="font-size: 0.75rem; opacity: 0.9;">Chính</small>


    <a th:href="@{/tagsController}"
       th:classappend="${activePage == 'tags'} ? 'active-link'">Tags</a>

    <a th:href="@{/authors}"
       th:classappend="${activePage == 'authors'} ? 'active-link'">Authors</a>

    <hr class="text-secondary">
    <small class="text-uppercase fw-bold px-3 mb-2 d-block text-white" style="font-size: 0.75rem; opacity: 0.9;">Nội dung</small>
    <a th:href="@{/admin/stories}">
      <i class="bi bi-journal-text"></i> Quản lý Truyện
    </a>

    <a th:href="@{/admin/users}">
      <i class="bi bi-people"></i> Thành viên
    </a>



    <hr class="text-secondary">
    <small class="text-uppercase fw-bold px-3 mb-2 d-block text-white" style="font-size: 0.75rem; opacity: 0.9;">Báo cáo</small>

    <a th:href="@{/admin/statistics}"
       th:classappend="${activePage == 'statistics'} ? 'active-link'">
      <i class="bi bi-graph-up-arrow"></i> Thống kê hệ thống
    </a>

    <form th:action="@{/logout}" method="post" class="text-center">
      <button type="submit" class="dropdown-item text-danger small fw-bold py-2" style="background: none; border: none; width: 100%;">
        SIGN OUT
      </button>
    </form>

  </nav>
</div>
</body>
</html>
