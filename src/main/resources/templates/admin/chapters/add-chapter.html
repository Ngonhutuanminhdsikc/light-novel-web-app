<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:fragment="header_head">
  <meta charset="UTF-8">
  <title>Admin - Light Novel Management</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
  <style>
    .sidebar { min-height: 100vh; background: #343a40; color: white; }
    .sidebar a { color: #d1d1d1; text-decoration: none; padding: 10px 20px; display: block; }
    .sidebar a:hover { background: #495057; color: white; }
    .active-link { background: #0d6efd !important; color: white !important; }
  </style>
</head>
<body>
<div class="container-fluid">
  <div class="row">
    <div th:replace="~{admin/fragments/layout :: sidebar}"></div>

    <main class="col-md-10 p-4">
      <div class="card shadow-sm">
        <div class="card-header bg-success text-white">
          <h3 class="mb-0">Soạn thảo chương mới</h3>
        </div>
        <div class="card-body">

          <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>

          <div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"></div>

          <form th:action="@{/chaptersController/save}" th:object="${chapter}" method="post" novalidate>
            <input type="hidden" name="storyId" th:value="${story.id}" />
            <input type="hidden" th:field="*{id}" />

            <div class="row mb-3">
              <div class="col-md-2">
                <label class="form-label fw-bold">Số chương:</label>
                <input type="number" step="0.1" th:field="*{chapterNumber}" class="form-control" />
                <small class="text-danger" th:if="${#fields.hasErrors('chapterNumber')}" th:errors="*{chapterNumber}"></small>
              </div>

              <div class="col-md-2">
                <label class="form-label fw-bold">Tập (Vol):</label>
                <input type="number" th:field="*{volNumber}" class="form-control" />
                <small class="text-danger" th:if="${#fields.hasErrors('volNumber')}" th:errors="*{volNumber}"></small>
              </div>

              <div class="col-md-8">
                <label class="form-label fw-bold">Tiêu đề chương:</label>
                <input type="text" th:field="*{title}" class="form-control" />
                <small class="text-danger" th:if="${#fields.hasErrors('title')}" th:errors="*{title}"></small>
              </div>

              <div class="mb-3">
                <label class="form-label fw-bold">Nội dung chương:</label>
                <textarea th:field="*{chapterContent.contentText}" class="form-control" rows="20"></textarea>
                <small class="text-danger" th:if="${#fields.hasErrors('chapterContent.contentText')}" th:errors="*{chapterContent.contentText}"></small>
              </div>
            </div>

            <div class="mt-4">
              <button type="submit" class="btn btn-primary px-4">Lưu chương</button>
              <a th:href="@{/chaptersController/story/{id}(id=${story.id})}" class="btn btn-outline-secondary">Hủy bỏ</a>
            </div>
          </form>
        </div>
      </div>
    </main>
  </div>
</div>
</body>
</html>
