<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:fragment="header_head">
  <meta charset="UTF-8">
  <title>Admin - Light Novel Management</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
  <style>
    .sidebar { min-height: 100vh; background: #343a40; color: white; }
    .sidebar a { color: #d1d1d1; text-decoration: none; padding: 10px 20px; display: block; }
    .sidebar a:hover { background: #495057; color: white; }
    .active-link { background: #0d6efd !important; color: white !important; }
  </style>
</head>
<body>
<div class="container-fluid">
  <div class="row">
    <div th:replace="~{admin/fragments/layout :: sidebar}"></div>

    <main class="col-md-10 px-md-4 py-4">
      <nav aria-label="breadcrumb">
        <ol class="breadcrumb">
          <li class="breadcrumb-item"><a th:href="@{/storiesController}">Truyện</a></li>
          <li class="breadcrumb-item">
            <a th:href="@{/chaptersController/story/{id}(id=${chapter.story.id})}"
               th:text="${chapter.story.title}"></a>
          </li>
          <li class="breadcrumb-item active">Sửa thông tin chương</li>
        </ol>
      </nav>

      <div class="card shadow-sm border-0">
        <div class="card-header bg-warning py-3">
          <h5 class="mb-0 text-dark">
            <i class="bi bi-pencil-square me-2"></i>Chỉnh sửa thông tin:
            <span class="fw-bold" th:text="${chapter.title}"></span>
          </h5>
        </div>
        <div class="card-body p-4">

          <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>

          <div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"></div>

          <form th:action="@{/chaptersController/edit/{id}(id=${chapter.id})}" th:object="${chapter}" method="post" novalidate>
            <input type="hidden" th:field="*{id}" />
            <input type="hidden" name="storyId" th:value="${chapter.story.id}" />


            <div class="row">
              <div class="col-md-3">
                <div class="mb-3">
                  <label class="form-label fw-bold">Số chương:</label>
                  <input type="number" step="0.1" th:field="*{chapterNumber}" class="form-control"/>
                  <small class="text-danger" th:if="${#fields.hasErrors('chapterNumber')}" th:errors="*{chapterNumber}"></small>
                </div>
              </div>

              <div class="col-md-3">
                <div class="mb-3">
                  <label class="form-label fw-bold">Tập (Vol):</label>
                  <input type="number" th:field="*{volNumber}" class="form-control" />
                  <small class="text-danger" th:if="${#fields.hasErrors('volNumber')}" th:errors="*{volNumber}"></small>
                </div>
              </div>
              <div class="col-md-6">
                <div class="mb-3">
                  <label class="form-label fw-bold">Tiêu đề chương:</label>
                  <input type="text" th:field="*{title}" class="form-control"/>
                  <small class="text-danger" th:if="${#fields.hasErrors('title')}" th:errors="*{title}"></small>
                </div>
              </div>
            </div>

            <div class="mb-3">
              <label class="form-label fw-bold">Đường dẫn (Slug):</label>
              <input type="text" th:field="*{slug}" class="form-control" readonly th:placeholder="'Tự động tạo: chuong-' + *{chapterNumber}" />
              <small class="text-muted italic">Slug này được hệ thống quản lý tự động theo số chương.</small>
            </div>

            <div class="mt-4 d-flex gap-2">
              <button type="submit" class="btn btn-primary px-4 shadow-sm">
                <i class="bi bi-save me-1"></i> Cập nhật thông tin
              </button>
              <a th:href="@{/chaptersController/story/{id}(id=${chapter.story.id})}" class="btn btn-outline-secondary px-4">
                Hủy bỏ
              </a>
            </div>
          </form>
        </div>
      </div>

    </main>
  </div>
</div>
</body>
</html>
