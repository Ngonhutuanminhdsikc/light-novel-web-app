<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Quên mật khẩu | LN-Minh</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background-color: #1a1a1a; color: #e0e0e0; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; }
    .forgot-card { background: #2d2d2d; border: none; border-radius: 12px; box-shadow: 0 8px 24px rgba(0,0,0,0.5); width: 100%; max-width: 400px; padding: 2rem; }
    .form-control { background-color: #3d3d3d; border: 1px solid #4d4d4d; color: white; }
    .form-control:focus { background-color: #454545; color: white; border-color: #0d6efd; box-shadow: none; }
    .btn-primary { background-color: #0d6efd; border: none; padding: 10px; font-weight: bold; }
    .brand-logo { color: #0d6efd; font-weight: bold; font-size: 24px; text-align: center; margin-bottom: 1.5rem; }
  </style>
</head>
<body>

<div class="forgot-card">
  <div class="brand-logo">LN-MINH</div>
  <h5 class="text-center mb-4">Khôi phục mật khẩu</h5>

  <p class="text-white small text-center mb-4">
    Vui lòng nhập Email đã đăng ký. Hệ thống sẽ gửi hướng dẫn khôi phục mật khẩu cho bạn.
  </p>

  <!-- Thông báo nếu email không tồn tại -->
  <div th:if="${error}" class="alert alert-danger py-2" style="font-size: 14px;" th:text="${error}"></div>

  <!-- Thông báo nếu đã gửi mail thành công -->
  <div th:if="${message}" class="alert alert-success py-2" style="font-size: 14px;" th:text="${message}"></div>

  <form th:action="@{/forgot}" method="post">
    <div class="mb-4">
      <label class="form-label">Email đăng ký</label>
      <input type="email" name="email" class="form-control" placeholder="example@gmail.com" required autofocus>
    </div>

    <button type="submit" class="btn btn-primary w-100">GỬI YÊU CẦU</button>
  </form>

  <div class="text-center mt-4">
    <a th:href="@{/login}" class="text-info text-decoration-none small">Quay lại Đăng nhập</a>
  </div>
</div>

</body>
</html>
