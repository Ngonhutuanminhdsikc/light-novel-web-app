<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:fragment="header_head">
  <meta charset="UTF-8">
  <title>Admin - Light Novel Management</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
  <style>
    .sidebar { min-height: 100vh; background: #343a40; color: white; }
    .sidebar a { color: #d1d1d1; text-decoration: none; padding: 10px 20px; display: block; }
    .sidebar a:hover { background: #495057; color: white; }
    .active-link { background: #0d6efd !important; color: white !important; }
  </style>
</head>
<body>
<div class="container-fluid">
  <div class="row">
    <div th:replace="~{admin/fragments/layout :: sidebar}"></div>

    <main class="col-md-10 p-4">
      <div class="card shadow mb-5">
        <div class="card-header bg-primary text-white d-flex justify-content-between align-items-center">
          <h3 class="mb-0">Thêm Truyện Mới</h3>
          <a th:href="@{/admin/stories}" class="btn btn-sm btn-light">Quay lại danh sách</a>
        </div>
        <div class="card-body">

          <div th:if="${errorMessage != null}" class="alert alert-danger border-0 shadow-sm mb-3" style="color: #842029; background-color: #f8d7da; border-color: #f5c2c7; border-radius: 6px; padding: 10px 15px;">
            <i class="bi bi-exclamation-triangle-fill me-2"></i>
            <strong th:text="${errorMessage}">Tin nhắn thông báo lỗi</strong>
          </div>

          <form th:action="@{/admin/stories/add}" th:object="${story}" method="post" enctype="multipart/form-data" novalidate>

            <div class="row">
              <div class="col-md-8">
                <div class="mb-3">
                  <label class="form-label fw-bold">Tiêu đề truyện:</label>
                  <input type="text" th:field="*{title}" id="title" class="form-control"
                         placeholder="Nhập tên truyện..." required onkeyup="generateSlug()">
                </div>

                <div class="mb-3">
                  <label class="form-label fw-bold">Slug (Đường dẫn):</label>
                  <input type="text" th:field="*{slug}" id="slug" class="form-control bg-light" readonly>
                </div>

                <div class="mb-3">
                  <label class="form-label fw-bold">Mô tả tóm tắt:</label>
                  <textarea th:field="*{description}" class="form-control" rows="8"
                            placeholder="Viết nội dung giới thiệu truyện tại đây..."></textarea>
                </div>
              </div>

              <div class="col-md-4">
                <div class="mb-3">
                  <label class="form-label fw-bold">Tác giả:</label>
                  <select th:field="*{author}" class="form-select" required>
                    <option value="">-- Chọn tác giả --</option>
                    <option th:each="a : ${authors}" th:value="${a.id}" th:text="${a.name}"></option>
                  </select>
                </div>

                <div class="mb-3">
                  <label class="form-label fw-bold">Trạng thái:</label>
                  <select th:field="*{status}" class="form-select">
                    <option th:each="st : ${statuses}" th:value="${st}" th:text="${st}"></option>
                  </select>
                </div>

                <div class="mb-3">
                  <label class="form-label fw-bold">Tải ảnh bìa lên:</label>
                  <input type="file" name="imageFile" class="form-control" accept="image/*" onchange="previewImage(this)">
                  <img id="preview" src="#" alt="Xem trước" class="mt-2 rounded shadow-sm" style="display:none; max-width: 100%; height: 200px; object-fit: cover;">
                </div>

                <div class="card bg-light border-0 p-3">
                  <div class="form-check form-switch">
                    <input class="form-check-input" type="checkbox" th:field="*{hot}" id="isHot">
                    <label class="form-check-label fw-bold" for="isHot">Đánh dấu là truyện HOT</label>
                  </div>
                </div>
              </div>
            </div>

            <hr class="my-4">

            <div class="mb-4">
              <label class="form-label fw-bold"><i class="bi bi-hash me-2"></i>Tags:</label>
              <div class="d-flex flex-wrap gap-2 p-3 border rounded bg-white shadow-sm">
                <div th:each="t : ${tags}" class="form-check badge bg-light text-dark p-2 border">
                  <input class="form-check-input ms-0 me-2" type="checkbox"
                         name="tagIds" th:value="${t.id}" th:id="'tag' + ${t.id}">
                  <label class="form-check-label" th:for="'tag' + ${t.id}" th:text="${t.name}"></label>
                </div>
              </div>
            </div>

            <div class="d-flex justify-content-end gap-3 pt-3 border-top">
              <a th:href="@{/admin/stories}" class="btn btn-outline-secondary px-4">Hủy bỏ</a>
              <button type="submit" class="btn btn-primary px-5 shadow">Lưu truyện ngay</button>
            </div>
          </form>
        </div>
      </div>
    </main>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
  function generateSlug() {
      let title = document.getElementById("title").value;
      let slug = title.toLowerCase()
          .normalize('NFD')
          .replace(/[\u0300-\u036f]/g, '')
          .replace(/[đĐ]/g, 'd')
          .replace(/([^0-9a-z-\s])/g, '')
          .replace(/(\s+)/g, '-')
          .replace(/-+/g, '-')
          .replace(/^-+|-+$/g, '');
      document.getElementById("slug").value = slug;
  }
</script>
</body>
</html>
