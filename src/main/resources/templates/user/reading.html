<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${chapter.title} + ' - ' + ${story.title}"></title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" th:href="@{/style/style.css}">
    <style>
        /* Giao diện Dark Mode đồng bộ */
        body {
            background-color: #1a1d20;
            color: #e9ecef;
            font-family: 'Segoe UI', Roboto, sans-serif;
            padding-bottom: 80px; /* Đẩy body lên để không bị thanh toolbar che */
            transition: background-color 0.3s ease;
        }

        .reading-container {
            max-width: 900px;
            background-color: #212529;
            padding: 40px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            border: 1px solid #343a40;
            transition: background-color 0.3s ease;
        }

        .chapter-content {
            font-size: 22px;
            line-height: 1.8;
            text-align: justify;
            color: #dee2e6;
        }

        .nav-sticky {
            position: sticky;
            top: 0;
            z-index: 1000;
            background: rgba(33, 37, 41, 0.98);
            border-bottom: 1px solid #3d4246;
            backdrop-filter: blur(10px);
        }

        /* Toolbar dưới chân */
        .bottom-toolbar {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background-color: #000000;
            border-top: 1px solid #343a40;
            padding: 10px 0;
            z-index: 1050;
        }

        .toolbar-item {
            color: #adb5bd;
            text-decoration: none;
            font-size: 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            background: none;
            border: none;
        }

        .toolbar-item:hover:not(.disabled) { color: #0d6efd; }
        .toolbar-item i { font-size: 22px; margin-bottom: 2px; }
        .toolbar-item.disabled { color: #495057; cursor: not-allowed; opacity: 0.5; }

        /* Bảng cài đặt */
        .settings-panel {
            position: fixed;
            top: 70px;
            right: 20px;
            width: 280px;
            background-color: #2b3035;
            color: white;
            padding: 20px;
            border-radius: 12px;
            border: 1px solid #495057;
            z-index: 2000;
            display: none;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .color-dot {
            width: 35px;
            height: 35px;
            border-radius: 50%;
            cursor: pointer;
            border: 2px solid #495057;
        }
        .color-dot:hover { border-color: #0d6efd; }

        /* Ẩn điều hướng cũ */
        .reading-container .border-top { display: none; }
    </style>
</head>
<body>

<div class="nav-sticky py-2 shadow-sm">
    <div class="container d-flex justify-content-between align-items-center">
        <a th:href="@{/story/{id}(id=${story.id})}" class="btn btn-sm btn-outline-dark">
            <i class="bi bi-arrow-left"></i>
        </a>
        <div class="text-center">
            <h6 class="mb-0 fw-bold text-truncate" style="max-width: 180px;" th:text="${story.title}">Tên truyện</h6>
        </div>
        <div class="d-flex gap-2">
            <button class="btn btn-sm btn-dark" onclick="toggleSettings()">
                <i class="bi bi-gear-fill"></i>
            </button>
            <div class="dropdown">
                <button class="btn btn-sm btn-dark dropdown-toggle" data-bs-toggle="dropdown">Chương</button>
                <ul class="dropdown-menu dropdown-menu-end" style="max-height: 300px; overflow-y: auto;">
                    <li th:each="c : ${chapters}">
                        <a class="dropdown-item" th:href="@{/reading/chapter/{id}(id=${c.id})}"
                           th:classappend="${c.id == chapter.id} ? 'active' : ''" th:text="${c.title}"></a>
                    </li>
                </ul>
            </div>
        </div>
    </div>
</div>

<div id="settingsPanel" class="settings-panel">
    <div class="d-flex justify-content-between mb-3 border-bottom pb-2">
        <h6 class="mb-0">Tùy chỉnh hiển thị</h6>
        <button type="button" class="btn-close btn-close-white" onclick="toggleSettings()"></button>
    </div>
    <div class="mb-3">
        <label class="small text-muted d-block mb-2">Màu nền</label>
        <div class="d-flex gap-2">
            <div class="color-dot" style="background-color: #ffffff;" onclick="changeTheme('white')"></div>
            <div class="color-dot" style="background-color: #f4ecd8;" onclick="changeTheme('sepia')"></div>
            <div class="color-dot" style="background-color: #1a1d20;" onclick="changeTheme('dark')"></div>
        </div>
    </div>
    <div>
        <label class="small text-muted d-block mb-2">Cỡ chữ</label>
        <div class="btn-group btn-group-sm w-100">
            <button class="btn btn-outline-light" onclick="changeFontSize(-2)">A-</button>
            <button class="btn btn-outline-light disabled" id="fontSizeDisplay">22px</button>
            <button class="btn btn-outline-light" onclick="changeFontSize(2)">A+</button>
        </div>
    </div>
</div>

<div class="container my-5">
    <div class="reading-container mx-auto rounded">
        <div class="text-center mb-5">
            <h2 class="fw-bold" th:text="${chapter.title}">Tiêu đề chương</h2>
            <p class="text-muted small">Cập nhật: <span th:text="${#temporals.format(chapter.createdAt, 'dd/MM/yyyy')}"></span></p>
            <hr class="w-25 mx-auto">
        </div>

        <div class="chapter-content mt-4"
             th:utext="${content != null ? content.contentText : 'Nội dung đang được cập nhật...'}"
             style="min-height: 200px;">
        </div>
    </div>
</div>

<nav class="bottom-toolbar">
    <div class="container">
        <div class="d-flex justify-content-around align-items-center">
            <a th:if="${prevId != null}"
               th:href="@{/reading/chapter/{id}(id=${prevId})}"
               class="toolbar-item">
                <i class="bi bi-arrow-left-square-fill"></i><span>Prev</span>
            </a>

            <div th:if="${prevId == null}" class="toolbar-item disabled">
                <i class="bi bi-arrow-left-square-fill"></i><span>Prev</span>
            </div>
            <a th:href="@{/history}" class="toolbar-item">
                <i class="bi bi-clock-history"></i><span>Recently</span>
            </a>
            <a th:href="@{/story/{id}(id=${story.id})}" class="toolbar-item">
                <i class="bi bi-hand-thumbs-up-fill"></i><span>Recommend</span>
            </a>

            <a th:if="${nextId != null}"
               th:href="@{/reading/chapter/{id}(id=${nextId})}"
               class="toolbar-item">
                <i class="bi bi-arrow-right-square-fill"></i><span>Next</span>
            </a>

            <div th:if="${nextId == null}" class="toolbar-item disabled">
                <i class="bi bi-arrow-right-square-fill"></i><span>Next</span>
            </div>
        </div>
    </div>
</nav>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<script>
    // 1. KHỞI TẠO: Đọc cấu hình đã lưu từ máy người dùng (nếu chưa có thì lấy mặc định)
    let currentFontSize = parseInt(localStorage.getItem('reader-font-size')) || 22;
    let currentTheme = localStorage.getItem('reader-theme') || 'dark';

    // Tự động áp dụng ngay khi vừa tải trang xong
    document.addEventListener("DOMContentLoaded", function() {
        applyFontSize(currentFontSize);
        changeTheme(currentTheme);
    });

    function toggleSettings() {
        const panel = document.getElementById('settingsPanel');
        if (panel.style.display === 'block') {
            panel.style.display = 'none';
        } else {
            panel.style.display = 'block';
        }
    }

    // 2. LOGIC TĂNG GIẢM CỠ CHỮ + LƯU TRẠNG THÁI
    function changeFontSize(delta) {
        currentFontSize += delta;
        if (currentFontSize < 14) currentFontSize = 14;
        if (currentFontSize > 36) currentFontSize = 36;

        applyFontSize(currentFontSize);
        localStorage.setItem('reader-font-size', currentFontSize); // Lưu lại vào trình duyệt
    }

    function applyFontSize(size) {
        const content = document.querySelector('.chapter-content');
        if (content) {
            content.style.fontSize = size + 'px';
        }
        const display = document.getElementById('fontSizeDisplay');
        if (display) {
            display.innerText = size + 'px';
        }
    }

    // 3. LOGIC ĐỔI MÀU NỀN + LƯU TRẠNG THÁI
    function changeTheme(theme) {
        const body = document.body;
        const container = document.querySelector('.reading-container');
        const content = document.querySelector('.chapter-content');

        if (!body || !container || !content) return;

        if (theme === 'sepia') {
            body.style.backgroundColor = '#f4ecd8';
            container.style.backgroundColor = '#fdf6e3';
            content.style.color = '#5b4636';
        } else if (theme === 'white') {
            body.style.backgroundColor = '#f8f9fa';
            container.style.backgroundColor = '#ffffff';
            content.style.color = '#212529';
        } else { // Mặc định là 'dark'
            body.style.backgroundColor = '#1a1d20';
            container.style.backgroundColor = '#212529';
            content.style.color = '#dee2e6';
            theme = 'dark'; // Đảm bảo gán đúng key
        }

        currentTheme = theme;
        localStorage.setItem('reader-theme', theme); // Lưu lại màu nền vào trình duyệt
    }
</script>
</body>
</html>
