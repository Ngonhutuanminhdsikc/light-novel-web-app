<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Soạn thảo chương mới - Light Novel System</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">

  <script src="https://cdn.ckeditor.com/4.22.1/standard/ckeditor.js"></script>
  <style>
    body {
        background-color: #0d1117 !important;
        color: #c9d1d9 !important;
        padding-top: 85px;
    }

    /* ==================== ĐỒNG BỘ THANH NAVBAR CÙNG HÀNG ==================== */
    .navbar .container,
    .navbar .container-fluid,
    nav .container,
    nav .container-fluid {
        display: flex !important;
        flex-wrap: nowrap !important;
        align-items: center !important;
        justify-content: space-between !important;
    }

    .navbar form, nav form {
        display: flex !important;
        align-items: center !important;
        margin-bottom: 0 !important;
        flex-grow: 1 !important;
        max-width: 320px !important;
        margin-left: auto !important;
        margin-right: 1.5rem !important;
    }

    .navbar form .input-group, nav form .input-group {
        display: flex !important;
        flex-wrap: nowrap !important;
        width: 100% !important;
    }

    .navbar form input.form-control, nav form input.form-control {
        background-color: #161b22 !important;
        border: 1px solid #30363d !important;
        color: #c9d1d9 !important;
    }
    /* ======================================================================== */

    .card-dark-custom {
        background-color: #161b22 !important;
        border: 1px solid #30363d !important;
        border-radius: 12px;
        overflow: hidden;
    }

    .card-header-custom {
        background-color: #21262d !important;
        border-bottom: 1px solid #30363d !important;
        color: #58a6ff !important;
    }

    /* Định dạng màu nhãn Label sáng rõ, không bị mờ */
    .form-label-custom {
        color: #8b949e !important;
        font-size: 0.85rem;
        letter-spacing: 0.5px;
    }

    .form-control-dark {
        background-color: #0d1117 !important;
        border: 1px solid #30363d !important;
        color: #c9d1d9 !important;
    }
    .form-control-dark:focus {
        background-color: #0d1117 !important;
        border-color: #58a6ff !important;
        color: #c9d1d9 !important;
        box-shadow: 0 0 0 3px rgba(88, 166, 255, 0.15);
    }

    .btn-action-dark {
        background-color: #21262d;
        border: 1px solid #30363d;
        color: #c9d1d9;
        transition: 0.2s;
    }
    .btn-action-dark:hover {
        background-color: #30363d;
        color: #58a6ff;
    }

    /* Làm sáng dấu gạch chéo phân cách (/) trong breadcrumb */
    .breadcrumb-item + .breadcrumb-item::before {
    color: #8b949e !important; /* Màu xám sáng để nhìn rõ phân cách */
    }

    /* Nền tổng thể của CKEditor 4 */
    .cke_chrome {
      background-color: #161b22 !important;
      border: 1px solid #30363d !important;
    }
    /* Nền thanh công cụ */
    .cke_top {
      background-color: #21262d !important;
      border-bottom: 1px solid #30363d !important;
    }
    /* Nền vùng soạn thảo */
    .cke_contents {
      background-color: #0d1117 !important;
      color: #c9d1d9 !important;
    }
    /* Màu chữ trong vùng soạn thảo */
    .cke_wysiwyg_frame, .cke_wysiwyg_div {
      background-color: #0d1117 !important;
      color: #c9d1d9 !important;
    }
    .cke_wysiwyg_div p {
      text-indent: 30px;
      margin-bottom: 10px;
    }
  </style>
</head>
<body>

<div th:replace="~{user/fragments/header :: user_navbar}"></div>

<div class="container mt-4">
  <nav aria-label="breadcrumb" class="mb-4">
    <ol class="breadcrumb">
      <li class="breadcrumb-item"><a th:href="@{/user/stories/my-stories}" class="text-primary-custom text-decoration-none" style="color: #58a6ff;">Truyện của tôi</a></li>
      <li class="breadcrumb-item"><a th:href="@{/user/chapters/{storyId}(storyId=${story.id})}" class="text-primary-custom text-decoration-none" style="color: #58a6ff;" th:text="${story.title}">Tên truyện</a></li>
      <li class="breadcrumb-item active text-white">Soạn chương mới</li>
    </ol>
  </nav>

  <div class="card card-dark-custom shadow-sm mb-5">
    <div class="card-header card-header-custom p-3">
      <h4 class="mb-0 fw-bold"><i class="bi bi-journal-plus me-2"></i>Soạn thảo chương mới</h4>
    </div>
    <div class="card-body p-4">
      <form th:action="@{/user/chapters/save}" th:object="${chapter}" method="post">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
        <input type="hidden" name="storyId" th:value="${story.id}" />
        <input type="hidden" th:field="*{id}" />

        <div class="row mb-4">
          <div class="col-md-2 mb-3 mb-md-0">
            <label class="form-label fw-bold form-label-custom">SỐ CHƯƠNG:</label>
            <input type="number" step="0.1" th:field="*{chapterNumber}" class="form-control form-control-dark" placeholder="Ví dụ: 1"/>
            <div class="text-danger small mt-1" th:if="${#fields.hasErrors('chapterNumber')}" th:errors="*{chapterNumber}"></div>
          </div>

          <div class="col-md-2 mb-3 mb-md-0">
            <label class="form-label fw-bold form-label-custom">TẬP (VOL):</label>
            <input type="number" th:field="*{volNumber}" class="form-control form-control-dark" placeholder="Ví dụ: 1" />
            <div class="text-danger small mt-1" th:if="${#fields.hasErrors('volNumber')}" th:errors="*{volNumber}"></div>
          </div>

          <div class="col-md-8">
            <label class="form-label fw-bold form-label-custom">TIÊU ĐỀ CHƯƠNG:</label>
            <input type="text" th:field="*{title}" class="form-control form-control-dark" placeholder="Ví dụ: Khởi đầu mới tại dị giới"/>
            <div class="text-danger small mt-1" th:if="${#fields.hasErrors('title')}" th:errors="*{title}"></div>
          </div>
        </div>

        <div class="mb-4">
          <label class="form-label fw-bold form-label-custom">NỘI DUNG CHƯƠNG:</label>
          <textarea id="editor" th:field="*{chapterContent.contentText}" class="form-control form-control-dark font-monospace" rows="18"></textarea>
          <div class="text-danger validation-error-msg" th:if="${#fields.hasErrors('chapterContent.contentText')}"
               th:errors="*{chapterContent.contentText}">Lỗi nội dung</div>
        </div>

        <div class="d-flex justify-content-between align-items-center border-top border-secondary pt-3">
          <a th:href="@{/user/chapters/{storyId}(storyId=${story.id})}" class="btn btn-action-dark px-4"><i class="bi bi-x-lg me-1"></i> Hủy bỏ</a>
          <button type="submit" class="btn btn-success px-4 rounded-pill fw-bold"><i class="bi bi-check-lg me-1"></i> Lưu chương</button>
        </div>
      </form>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
  var editor = CKEDITOR.replace('editor', {
        height: 400,
        toolbar: [
            { name: 'basicstyles', items: ['Bold', 'Italic', 'Underline', 'Strike', '-', 'RemoveFormat'] },
            { name: 'paragraph', items: ['NumberedList', 'BulletedList', '-', 'Outdent', 'Indent', '-', 'Blockquote'] },
            { name: 'links', items: ['Link', 'Unlink'] },
            { name: 'insert', items: ['Image', 'Table', 'HorizontalRule', 'SpecialChar'] },
            { name: 'styles', items: ['Format', 'FontSize'] },
            { name: 'tools', items: ['Maximize', 'Source'] }
        ]
    });

   document.querySelector('form').addEventListener('submit', function(e) {
    for (var instance in CKEDITOR.instances) {
        CKEDITOR.instances[instance].updateElement();
    }
    // Debug: Kiểm tra xem đã lấy được dữ liệu chưa
    console.log("CKEditor content updated: ", document.getElementById('editor').value);
});
</script>
</body>
</html>
