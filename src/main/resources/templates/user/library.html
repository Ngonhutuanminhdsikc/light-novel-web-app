<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <title>Tủ truyện | LN-Minh</title>
  <!-- Nhúng tài nguyên dùng chung -->
  <th:block th:replace="~{user/fragments/header :: header_resources}"></th:block>
  <!-- Nhúng file CSS chứa các biến :root của Minh -->
  <link rel="stylesheet" th:href="@{/style/style.css}">

  <style>
    /* Style riêng cho nút xóa trên trang Tủ truyện */
    .btn-unfollow-circle {
        position: absolute;
        top: 10px;
        right: 10px;
        width: 32px;
        height: 32px;
        border-radius: 50%;
        background: rgba(248, 81, 73, 0.2);
        border: 1px solid rgba(248, 81, 73, 0.4);
        color: #ff7b72;
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 20;
        transition: all 0.2s ease;
        backdrop-filter: blur(4px);
    }

    .btn-unfollow-circle:hover {
        background: #f85149;
        color: white;
        transform: scale(1.1);
    }

    /* Đảm bảo ảnh cover chiếm trọn card */
    .hako-cover-custom {
        width: 100%;
        height: 100%;
        object-fit: cover;
    }
  </style>
</head>
<body style="background-color: var(--bg-body); color: var(--text-main);">
<div th:replace="~{user/fragments/header :: user_navbar}"></div>

<div class="container mt-4">
  <h3 class="mb-4 border-bottom border-secondary pb-3 fw-bold">
    <i class="bi bi-bookmark-star-fill text-warning me-2"></i>Tủ truyện của tôi
  </h3>


  <div th:if="${#lists.isEmpty(follows)}" class="text-center py-5 rounded-3"
       style="background-color: var(--bg-card); border: 1px solid var(--border-color);">
    <i class="bi bi-journal-x fs-1 text-muted"></i>
    <p class="mt-3 text-muted">Bạn chưa theo dõi bộ truyện nào.</p>
    <a href="/" class="btn btn-hako-primary px-4">Khám phá ngay</a>
  </div>


  <div class="hako-grid" th:if="${!#lists.isEmpty(follows)}">
    <div th:each="follow : ${follows}" class="position-relative">


      <a th:href="@{/story/{id}(id=${follow.story.id})}" class="hako-card">
        <div class="hako-cover-wrapper">
          <img th:src="${follow.story.thumbnailUrl != null ? follow.story.thumbnailUrl : '/images/no-cover.jpg'}"
               class="hako-cover-custom" alt="Cover">


          <div class="hako-overlay">
            <div class="hako-title-overlay" th:text="${follow.story.title}">Tên truyện</div>
            <div class="hako-meta">
                            <span class="badge bg-dark border border-secondary"
                                  style="font-size: 0.65rem;"
                                  th:text="${follow.story.status}">Status</span>
            </div>
          </div>
        </div>
      </a>


      <button class="btn-unfollow-circle shadow-sm"
              title="Bỏ theo dõi"
              th:onclick="'unfollowInLibrary(' + ${follow.story.id} + ')'">
        <i class="bi bi-trash"></i>
      </button>
    </div>
  </div>
</div>

<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script>
  function unfollowInLibrary(storyId) {
      if(confirm('Bạn muốn bỏ theo dõi truyện này khỏi tủ truyện?')) {
          const token = $("meta[name='_csrf']").attr("content");
          const header = $("meta[name='_csrf_header']").attr("content");

          $.ajax({
              // Đảm bảo URL này khớp với Controller xử lý Follow của bạn
              url: '/follows/toggle/' + storyId,
              type: 'POST',
              beforeSend: function(xhr) {
                  if (header && token) xhr.setRequestHeader(header, token);
              },
              success: function(response) {
                  // Nếu response báo thành công hoặc trạng thái là UNFOLLOWED
                  location.reload();
              },
              error: function() {
                  alert("Có lỗi xảy ra, vui lòng thử lại!");
              }
          });
      }
  }
</script>
</body>
</html>
