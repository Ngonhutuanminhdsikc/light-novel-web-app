<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
  <th:block th:fragment="header_resources">
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <meta th:if="${_csrf}" name="_csrf" th:content="${_csrf.token}"/>
    <meta th:if="${_csrf}" name="_csrf_header" th:content="${_csrf.headerName}"/>
  </th:block>
</head>
<body>

<header th:fragment="user_navbar" class="navbar navbar-expand-lg navbar-dark user-navbar sticky-top">

  <style>
    .user-navbar { background-color: #0f111a; border-bottom: 1px solid #2d333b; padding: 0.5rem 0; }
    .nav-link { color: #8b949e !important; font-weight: 500; font-size: 0.95rem; transition: color 0.2s; }
    .nav-link:hover { color: #ffffff !important; }

    .search-container { position: relative; display: flex; align-items: center; }

    .search-input {
        background-color: #161b22;
        border: 1px solid #30363d;
        color: white;
        border-radius: 20px;
        padding: 0;
        width: 0;
        opacity: 0;
        visibility: hidden;
        transition: all 0.3s ease;
        outline: none;
    }

    .search-container.active .search-input {
        width: 200px;
        opacity: 1;
        visibility: visible;
        padding: 0.35rem 1rem;
        margin-right: 10px;
    }
    .search-input:focus {
        background-color: #1c2128;
        border-color: #58a6ff;
        box-shadow: 0 0 0 2px rgba(88, 166, 255, 0.15);
    }
    #searchBtn { z-index: 2; transition: color 0.2s; cursor: pointer; }
    #searchBtn:hover { color: #58a6ff !important; }

    /* FIX TRIỆT ĐỂ DROPDOWN BOOTSTRAP */
    .dropdown .dropdown-menu {
        background-color: #0d1117 !important;
        border: 1px solid #30363d !important;
        border-radius: 12px !important;
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.6) !important;
        width: 280px !important;
        margin-top: 10px !important;
    }

    .dropdown .dropdown-item-custom {
        color: #c9d1d9 !important;
        padding: 0.6rem 1rem !important;
        border-radius: 6px !important;
        margin: 0 0.5rem !important;
        transition: all 0.2s !important;
        background: transparent !important;
    }

    .dropdown .dropdown-item-custom:hover {
        background-color: #161b22 !important;
        color: #58a6ff !important;
    }

    .dropdown .icon-box {
        background-color: #161b22 !important;
        color: #8b949e !important;
        width: 32px;
        height: 32px;
        display: flex;
        align-items: center;
        justify-content: center;
        border-radius: 6px;
        margin-right: 12px;
    }

    .dropdown .dropdown-menu .text-white,
    .dropdown .dropdown-menu .fw-bold {
        color: #ffffff !important;
    }

    .dropdown .dropdown-menu .text-muted {
        color: #8b949e !important;
    }

    .dropdown .dropdown-menu .dropdown-divider {
        border-color: #30363d !important;
        opacity: 1 !important;
        margin: 0.5rem 0 !important;
    }

    .dropdown .dropdown-menu button.text-danger:hover {
        background-color: rgba(248, 81, 73, 0.1) !important;
        color: #ff7b72 !important;
        border-radius: 6px !important;
    }

    /* ==================== FIX NÚT SIGN IN TÀNG HÌNH ==================== */
    .btn-signin-custom {
        background-color: #238636 !important; /* Màu xanh lá GitHub (hoặc đổi thành #21262d nếu muốn màu xám tối) */
        border: 1px solid rgba(240, 246, 252, 0.1) !important;
        color: #ffffff !important;
        font-size: 12px !important;
        font-weight: 600 !important;
        padding: 0.4rem 0.8rem !important;
        border-radius: 6px !important;
        text-decoration: none !important;
        transition: all 0.2s ease-in-out;
        white-space: nowrap;
    }

    .btn-signin-custom:hover {
        background-color: #2ea44f !important; /* Sáng lên chút khi hover */
        color: #ffffff !important;
        box-shadow: 0 0 8px rgba(46, 164, 79, 0.4);
    }
  </style>

  <div class="container">
    <a class="navbar-brand fw-bold text-white me-4" href="/" style="letter-spacing: -1px;">LN</a>

    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#userNav">
      <span class="navbar-toggler-icon"></span>
    </button>

    <div class="collapse navbar-collapse" id="userNav">
      <ul class="navbar-nav me-auto mb-2 mb-lg-0">
        <li class="nav-item">
          <a class="nav-link" th:href="@{/user/stories/create-new-story}">
            <i class="bi bi-journal-plus me-1"></i> Đăng truyện
          </a>
        </li>
      </ul>

      <div class="d-flex align-items-center">
        <form th:action="@{/search}" method="GET" class="search-container me-3" id="searchForm">
          <input type="text" name="keyword" id="searchInput" class="form-control search-input" placeholder="Tìm truyện...">
          <button type="button" class="btn btn-link text-white-50 p-2 magnifying-glass-btn" id="searchBtn"
                  style="position: relative; z-index: 9999; display: flex; align-items: center;">
            <i class="bi bi-search fs-5" style="pointer-events: none;"></i>
          </button>
        </form>

        <div class="dropdown">
          <button class="btn btn-link text-white p-0 border-0" type="button" data-bs-toggle="dropdown">
            <i sec:authorize="isAnonymous()" class="bi bi-person-circle fs-3"></i>
            <img sec:authorize="isAuthenticated()"
                 th:src="${user != null and user.avatarUrl != null ? user.avatarUrl : '/uploads/default-avatar.png'}"
                 class="rounded-circle" width="32" height="32"
                 style="object-fit: cover; border: 1px solid #30363d;">
          </button>

          <ul class="dropdown-menu dropdown-menu-end dropdown-menu-dark-custom py-3">
            <li sec:authorize="isAnonymous()">
              <div class="px-3 pb-3 d-flex align-items-center">
                <div class="rounded-circle bg-secondary me-3" style="width: 48px; height: 48px; opacity: 0.2;"></div>
                <div class="flex-grow-1">
                  <div class="fw-bold text-white small">Khách</div>
                  <div class="text-muted" style="font-size: 11px;">Đăng nhập ngay</div>
                </div>
                <a th:href="@{/login}" class="btn btn-signin-custom ms-2">Sign In</a>
              </div>
            </li>

            <li sec:authorize="isAuthenticated()">
              <div class="px-3 pb-3 d-flex align-items-center border-bottom border-secondary border-opacity-10 mb-2">
                <img th:src="${user != null and user.avatarUrl != null ? user.avatarUrl : '/uploads/default-avatar.png'}"
                     class="rounded-circle me-3" width="48" height="48" style="object-fit: cover;">
                <div>
                  <a th:href="@{/user/profile}" class="text-decoration-none">
                    <div class="fw-bold text-white small" sec:authentication="name">Username</div>
                  </a>
                  <div class="text-success" style="font-size: 11px;">
                    <i class="bi bi-circle-fill me-1" style="font-size: 7px;"></i>Online
                  </div>
                </div>
              </div>
            </li>

            <li>
              <a class="dropdown-item dropdown-item-custom d-flex align-items-center" href="/follows/user/tu-truyen">
                <div class="icon-box"><i class="bi bi-bookmark-star"></i></div>
                <span class="small flex-grow-1">Tủ truyện</span>
              </a>
            </li>
            <li>
              <a class="dropdown-item dropdown-item-custom d-flex align-items-center" href="/historyController/my-history">
                <div class="icon-box"><i class="bi bi-clock-history"></i></div>
                <span class="small flex-grow-1">Lịch sử đọc</span>
              </a>
            </li>
            <li>
              <a class="dropdown-item dropdown-item-custom d-flex align-items-center" th:href="@{/user/stories/my-stories}">
                <div class="icon-box"><i class="bi bi-journal-text"></i></div>
                <span class="small flex-grow-1">Truyện của tôi</span>
              </a>
            </li>

            <li sec:authorize="isAuthenticated()">
              <hr class="dropdown-divider">
              <form th:action="@{/logout}" method="post" class="text-center">
                <button type="submit" class="dropdown-item text-danger small fw-bold py-2" style="background: none; border: none; width: 100%;">
                  SIGN OUT
                </button>
              </form>
            </li>
          </ul>
        </div>
      </div>
    </div>
  </div>
</header>

<th:block th:fragment="header_scripts">
  <script>
    $(document).ready(function() {
        console.log("Script Header đã nạp!");
        $(document).on('click', '.magnifying-glass-btn', function(e) {
            e.preventDefault(); e.stopPropagation();
            const $searchForm = $(this).closest('#searchForm');
            const $searchInput = $searchForm.find('#searchInput');
            if (!$searchForm.hasClass('active')) {
                $searchForm.addClass('active'); $searchInput.focus();
            } else {
                if ($searchInput.val().trim() !== "") { $searchForm.submit(); }
                else { $searchForm.removeClass('active'); }
            }
        });
        $(document).on('click', function(e) {
            if (!$(e.target).closest('#searchForm').length) { $('#searchForm').removeClass('active'); }
        });
    });
  </script>
</th:block>

</body>
</html>
