<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Truyện của tôi - Light Novel System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">

    <style>
        body {
             background-color: #0d1117 !important;
             color: #c9d1d9 !important;

         }

         .navbar .container,
         .navbar .container-fluid,
         nav .container,
         nav .container-fluid {
             display: flex !important;
             flex-wrap: nowrap !important;
             align-items: center !important;
             justify-content: space-between !important;
         }

         .navbar form,
         nav form {
             display: flex !important;
             align-items: center !important;
             margin-bottom: 0 !important;
             flex-grow: 1 !important;
             max-width: 320px !important;
             margin-left: auto !important;
             margin-right: 1.5rem !important;
         }

         .navbar form .input-group,
         nav form .input-group {
             display: flex !important;
             flex-wrap: nowrap !important;
             width: 100% !important;
         }

         .navbar form input.form-control,
         nav form input.form-control {
             background-color: #161b22 !important;
             border: 1px solid #30363d !important;
             color: #c9d1d9 !important;
             font-size: 0.9rem !important;
             padding: 0.375rem 0.75rem !important;
         }

         .navbar form button,
         nav form button {
             background-color: #21262d !important;
             border: 1px solid #30363d !important;
             border-left: none !important;
             color: #8b949e !important;
             display: flex !important;
             align-items: center !important;
             justify-content: center !important;
         }
         .navbar form button:hover,
         nav form button:hover {
             color: #58a6ff !important;
             background-color: #30363d !important;
         }

         .card-dark-custom {
             background-color: #161b22 !important;
             border: 1px solid #30363d !important;
             border-radius: 12px;
             overflow: hidden;
         }

         .table-dark-custom {
             background-color: transparent !important;
             margin-bottom: 0;
         }

         .table-dark-custom thead th {
             background-color: #0d1117 !important;
             color: #8b949e !important;
             border-bottom: 1px solid #30363d !important;
             padding: 1rem;
             text-transform: uppercase;
             font-size: 0.8rem;
         }

         .table-dark-custom tbody td {
             background-color: transparent !important;
             color: #c9d1d9 !important;
             border-bottom: 1px solid #21262d !important;
             padding: 1rem;
         }

         .table-dark-custom tbody tr:hover td {
             background-color: #1c2128 !important;
         }

         .text-primary-custom { color: #58a6ff !important; text-decoration: none; }
         .text-primary-custom:hover { text-decoration: underline; }

         .btn-action-dark {
             background-color: #21262d;
             border: 1px solid #30363d;
             color: #c9d1d9;
             transition: 0.2s;
         }
         .btn-action-dark:hover {
             background-color: #30363d;
             color: #58a6ff;
             border-color: #8b949e;
         }
         .btn-delete:hover {
             color: #f85149 !important;
             border-color: #f85149 !important;
         }

         .badge-pending { background-color: rgba(210, 153, 34, 0.1); color: #d29922; border: 1px solid rgba(210, 153, 34, 0.3); }
         .badge-published { background-color: rgba(35, 134, 54, 0.1); color: #3fb950; border: 1px solid rgba(35, 134, 54, 0.3); }
    </style>
</head>
<body>

<div th:replace="~{user/fragments/header :: user_navbar}"></div>

<div class="container pt-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h3 class="fw-bold text-white mb-1">Truyện của tôi</h3>
            <span class="text-light small">Quản lý các tác phẩm bạn đã đăng tải</span>
        </div>
        <a th:href="@{/user/stories/create-new-story}" class="btn btn-success btn-sm px-3 rounded-pill shadow-sm">
            <i class="bi bi-plus-lg me-1"></i> Đăng truyện mới
        </a>
    </div>

    <div class="card card-dark-custom">
        <div class="table-responsive">

            <!-- Hiển thị thông báo thành công hoặc lỗi -->
            <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show" role="alert">
                <i class="bi bi-exclamation-triangle-fill me-2"></i> <span th:text="${errorMessage}"></span>
                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
            </div>

            <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show" role="alert">
                <i class="bi bi-check-circle-fill me-2"></i> <span th:text="${successMessage}"></span>
                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
            </div>

            <table class="table table-dark-custom align-middle">
                <thead>
                <tr>
                    <th class="text-center" style="width: 80px;">Bìa</th>
                    <th>Thông tin truyện</th>
                    <th style="width: 130px;">Ngày đăng</th>
                    <th class="text-center" style="width: 140px;">Trạng thái</th>
                    <th class="text-center" style="width: 150px;">Hành động</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="s : ${stories}">
                    <td class="text-center">
                        <img th:src="${s.thumbnailUrl != null ? s.thumbnailUrl : '/images/default-cover.jpg'}"
                             width="55" height="75" class="rounded shadow-sm border border-secondary" style="object-fit: cover;">
                    </td>

                    <td>
                        <a th:href="@{/story/{id}(id=${s.id})}" class="fw-bold text-primary-custom d-block mb-1" th:text="${s.title}"></a>
                        <div class="text-muted small">
                            <i class="bi bi-person me-1"></i><span th:text="${s.author != null ? s.author.name : 'Tác giả'}"></span>
                        </div>
                    </td>

                    <td class="text-muted small" th:text="${#temporals.format(s.createdAt, 'dd/MM/yyyy')}"></td>

                    <td class="text-center">
                        <span th:if="${s.approvalStatus != null and s.approvalStatus.name() == 'PENDING'}" class="badge badge-pending">
                            <i class="bi bi-clock-history me-1"></i> Chờ duyệt
                        </span>

                        <span th:if="${s.approvalStatus != null and s.approvalStatus.name() == 'PUBLISHED'}" class="badge badge-published">
                            <i class="bi bi-check-circle me-1"></i> Đã phát hành
                        </span>

                        <span th:if="${s.approvalStatus != null and s.approvalStatus.name() == 'REJECTED'}" class="badge bg-danger bg-opacity-10 text-danger border border-danger border-opacity-20">
                            <i class="bi bi-exclamation-octagon me-1"></i> Bị từ chối
                        </span>
                    </td>

                    <td class="text-center">
                        <div class="btn-group">
                            <a th:href="@{/user/chapters/{id}(id=${s.id})}"
                               class="btn btn-sm btn-action-dark"
                               title="Quản lý chương">
                                <i class="bi bi-list-ul"></i>
                            </a>
                            <a th:href="@{/user/stories/edit/{id}(id=${s.id})}" class="btn btn-sm btn-action-dark" title="Sửa"><i class="bi bi-pencil"></i></a>
                            <a th:href="@{/user/stories/delete/{id}(id=${s.id})}"
                               class="btn btn-sm btn-action-dark btn-delete"
                               title="Xóa"
                               onclick="return confirm('Bạn có chắc chắn muốn xóa vĩnh viễn truyện này?')">
                                <i class="bi bi-trash"></i>
                            </a>
                        </div>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<th:block th:replace="~{user/fragments/header :: header_scripts}"></th:block>
</body>
</html>
