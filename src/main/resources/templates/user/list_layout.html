<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title th:text="${keyword != null ? 'Tìm kiếm: ' + keyword : title} + ' - LN-MINH'"></title>
  <th:block th:replace="~{user/fragments/header :: header_resources}"></th:block>
  <link rel="stylesheet" th:href="@{/style/style.css}">

  <style>
    :root {
        --bg-body: #0d1117;
        --bg-card: #161b22;
        --border-color: #30363d;
        --text-main: #c9d1d9;
        --accent-purple: #8957e5;
        --accent-purple-light: #d2a8ff;
    }

    body {
        background-color: var(--bg-body) !important;
        color: var(--text-main);
    }

    .list-container { max-width: 1100px; margin: 40px auto; padding: 0 15px; }

    .list-header {
        border-bottom: 2px solid var(--border-color);
        padding-bottom: 15px;
        margin-bottom: 30px;
        display: flex;
        align-items: center;
        gap: 15px;
    }

    .story-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
        gap: 25px;
    }

    .story-card {
        background-color: var(--bg-card);
        border: 1px solid var(--border-color);
        border-radius: 10px;
        overflow: hidden;
        transition: transform 0.3s, border-color 0.3s;
        display: flex;
        flex-direction: column;
    }

    .story-card:hover {
        transform: translateY(-5px);
        border-color: var(--accent-purple);
    }

    .story-cover-link { position: relative; display: block; width: 100%; height: 250px; }

    .story-cover { width: 100%; height: 100%; object-fit: cover; }

    .story-badge {
        position: absolute;
        top: 10px;
        right: 10px;
        background: rgba(137, 87, 229, 0.9);
        color: white;
        font-size: 0.7rem;
        padding: 2px 8px;
        border-radius: 4px;
        font-weight: bold;
    }

    .story-info { padding: 15px; flex-grow: 1; display: flex; flex-direction: column; }

    .story-title {
        font-size: 1rem;
        font-weight: 600;
        color: var(--accent-purple-light);
        text-decoration: none;
        margin-bottom: 8px;
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
        overflow: hidden;
        height: 2.8em;
    }

    .story-meta {
        font-size: 0.8rem;
        color: #8b949e;
        display: flex;
        justify-content: space-between;
        margin-top: auto;
    }

    @media (max-width: 600px) {
        .story-grid { grid-template-columns: repeat(2, 1fr); gap: 15px; }
        .story-cover { height: 200px; }
    }

    .btn-purple {
        background-color: var(--accent-purple) !important;
        color: white !important;
        border: none;
        font-weight: 600;
        transition: all 0.3s;
    }

    .btn-purple:hover {
        background-color: var(--accent-purple-light) !important;
        color: #0d1117 !important;
        transform: scale(1.02);
    }
  </style>
</head>
<body>

<div th:replace="~{user/fragments/header :: user_navbar}"></div>

<div class="list-container">
  <div class="list-header">
    <i th:class="${keyword != null || authorName != null ? 'bi bi-search fs-3' : 'bi bi-stars fs-3'}"
       style="color: var(--accent-purple-light)"></i>

    <h2 class="mb-0 fw-bold">
      <span th:if="${keyword != null || authorName != null}">
            Kết quả tìm kiếm nâng cao
        </span>
      <span th:unless="${keyword != null || authorName != null}" th:text="${title}">Danh sách truyện</span>
    </h2>
  </div>

  <div th:if="${isSearchPage}" class="card border-0 shadow-sm mb-4" style="background-color: var(--bg-card); border: 1px solid var(--border-color) !important;">
    <div class="card-body">
      <form th:action="@{/search}" method="get" class="row g-3">

        <div class="col-md-3 col-sm-6">
          <label class="form-label small" style="color: #c9d1d9;">Từ khóa truyện</label>
          <input type="text" name="keyword" th:value="${keyword}"
                 class="form-control bg-dark text-white border-secondary" placeholder="Tên truyện...">
        </div>

        <div class="col-md-2 col-sm-6">
          <label class="form-label small" style="color: #c9d1d9;">Tác giả</label>
          <input type="text" name="authorName" th:value="${authorName}"
                 class="form-control bg-dark text-white border-secondary" placeholder="Tên tác giả...">
        </div>

        <div class="col-md-3 col-sm-6">
          <label class="form-label small" style="color: #c9d1d9;">Thể loại</label>
          <select name="tagId" class="form-select bg-dark text-white border-secondary">
            <option value="">Tất cả thể loại</option>
            <option th:each="tag : ${allTags}" th:value="${tag.id}" th:text="${tag.name}"
                    th:selected="${selectedTag == tag.id}"></option>
          </select>
        </div>

        <div class="col-md-2 col-sm-6">
          <label class="form-label small" style="color: #c9d1d9;">Trạng thái</label>
          <select name="status" class="form-select bg-dark text-white border-secondary">
            <option value="">Tất cả</option>
            <option value="ONGOING" th:selected="${selectedStatus == 'ONGOING'}">Đang tiến hành</option>
            <option value="COMPLETED" th:selected="${selectedStatus == 'COMPLETED'}">Hoàn thành</option>
          </select>
        </div>

        <div class="col-md-2 d-flex align-items-end">
          <button type="submit" class="btn btn-purple w-100 py-2">
            <i class="bi bi-filter-left"></i> Lọc kết quả
          </button>
        </div>

      </form>
    </div>
  </div>

  <div class="story-grid">
    <div th:each="story : ${stories}" class="story-card">
      <a th:href="@{/story/{id}(id=${story.id})}" class="story-cover-link">
        <img th:src="${story.thumbnailUrl ?: '/images/default-cover.jpg'}"
             class="story-cover" alt="Cover">
        <span class="story-badge" th:if="${story.status != null}" th:text="${story.status}">HOT</span>
      </a>

      <div class="story-info">
        <a th:href="@{/story/{id}(id=${story.id})}"
           class="story-title" th:text="${story.title}">Tên truyện</a>

        <div class="story-meta">
          <span><i class="bi bi-eye"></i> [[${story.storyStats?.viewCount ?: 0}]]</span>
          <span th:text="${#temporals.format(story.createdAt, 'dd/MM')}">Ngày</span>
        </div>
      </div>
    </div>
  </div>

  <div th:if="${#lists.isEmpty(stories)}" class="text-center py-5 border border-secondary rounded mt-4">
    <i class="bi bi-emoji-frown fs-1 text-muted"></i>
    <p class="mt-3" th:text="${keyword != null || authorName != null ? 'Không tìm thấy truyện nào thỏa mãn bộ lọc.' : 'Hiện chưa có truyện nào trong danh sách này.'}"></p>
    <a href="/" class="btn btn-outline-primary btn-sm">Quay về trang chủ</a>
  </div>

</div>

<th:block th:replace="~{user/fragments/header :: header_scripts}"></th:block>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
